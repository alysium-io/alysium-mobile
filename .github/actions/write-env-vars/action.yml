name: 'Write Environment Variables'
description: 'Write environment variables to .env.* file'
inputs:
  ENV:
    description: 'ENV environment variable name'
    type: choice
    options:
      - qa
      - demo
      - prod
    required: true
  SENTRY_DSN:
    description: 'SENTRY_DSN environment variable name'
    type: choice
    options:
      - qa
      - prod
  BUILD_NUMBER:
    description: 'BUILD_NUMBER environment variable name'
    type: string
    required: true

runs:
  using: 'composite'
  steps:
    - run: |
        # Environment name
        echo "ENV=${{ inputs.ENV }}" >> .env.${{ inputs.ENV }}

        # Api url (e.g. https://qa-api.alysium.io)
        echo "API_URL=https://api-${{ inputs.ENV }}.alysium.io/alysium" >> .env.${{ inputs.ENV }}

        # Images base url (e.g. IMAGES_BASE_URL='https://dev-images.alysium.io/')
        echo "IMAGES_BASE_URL=https://${{ inputs.ENV }}-images.alysium.io/" >> .env.${{ inputs.ENV }}

        # Web URL
        if [ "${{ inputs.ENV }}" = "qa" ]; then
          echo "WEB_URL=https://qa.alysium.io" >> .env.${{ inputs.ENV }}
        elif [ "${{ inputs.ENV }}" = "prod" ]; then
          echo "WEB_URL=https://alysium.io" >> .env.${{ inputs.ENV }}
        else
          echo "WEB_URL=http://localhost:5173" >> .env.${{ inputs.ENV }}
        fi

        # Sentry DSN
        echo "SENTRY_DSN=${{ inputs.SENTRY_DSN }}" >> .env.${{ inputs.ENV }}

        # Build number
        echo "BUILD_NUMBER=${{ inputs.BUILD_NUMBER }}" >> .env.${{ inputs.ENV }}

      shell: bash